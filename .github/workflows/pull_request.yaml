name: CI Action

on:
  pull_request:
    types: ['opened', 'reopened', 'edited', 'synchronize']
    branches: ['main']
    paths:
      - '.src/**'
      - 'pkgs/**'
      - '.docker/**'
      - 'main.go'
      - 'config.yaml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read
  issues: write


jobs:
  Manual_Approval:
    uses: trstringer/manual-approval@v1.9.1
    with:
      secret: ${{ github.TOKEN }}
      approvers: ygsanabria8
      minimum-approvals: 1
      issue-title: "Request Approval For Building Project"
      issue-body: "Please verify if ypu want to deploy this project"
      timeout-minutes: 2

  Build_Project:
    runs-on: ubuntu-22.04
    steps:
      - name: Cloning Project
        uses: actions/checkout@v4

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Golang Dependencies
        run: make install

      - name: Build App
        run: make build

  Run_Unit_Test:
    needs: Build_Project
    runs-on: ubuntu-22.04
    steps:
      - name: Cloning Project
        uses: actions/checkout@v4

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Golang Dependencies
        run: make install

      - name: Execute Test
        run: make tests
